version: '3.9'

services:
  # Python FastAPI backend
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Use SQLite for simplicity by default, or provide POSTGRES_URL if adding Postgres
      DATABASE_URL: sqlite:///./agent_monitor.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy-key}
    volumes:
      - ./backend:/app

  # React frontend
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
